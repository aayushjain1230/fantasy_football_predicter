name: Data Refresh Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 2"

jobs:
  validate-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]" -r requirements.txt

      - name: Validate fixture data quality
        run: |
          python scripts/validate_data_quality.py

      - name: Fixture-only refresh smoke test
        run: |
          python scripts/download_historical_data.py --fixture-only
          python scripts/refresh_current_adp.py --fixture-only

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: data/quality/latest_report.json
